<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockFlow — Inventory & Invoicing</title>
  <meta name="description" content="Company-wise inventory management and professional invoice generation system." />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Toast container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- App shell: sidebar + main -->
  <div id="shell" class="shell hidden">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main-wrapper">
      <header id="topbar" class="topbar"></header>
      <main id="app" class="page-content"></main>
    </div>
  </div>

  <!-- Auth wrapper (full screen) -->
  <div id="auth-wrapper" class="auth-wrapper">
    <div id="auth-app"></div>
  </div>

  <!-- Modal container -->
  <div id="modal-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
