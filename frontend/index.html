<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockFlow — Inventory &amp; Invoicing</title>
  <meta name="description" content="Company-wise inventory management and professional invoice generation." />

  <!--
    Google Fonts: Inter
    · preconnect warms the TCP/TLS handshake before the stylesheet request fires.
    · The stylesheet itself is loaded with media="print" + onload so it is
      non-render-blocking — the browser fetches it asynchronously and swaps
      it in once ready, instead of pausing the parser until the CDN responds.
    · display=swap means body text renders immediately in the fallback font;
      Inter replaces it when ready rather than keeping the page blank.
    · Weights trimmed to 400/500/600/700 — 300 and 800 were never used in the
      design; removing them cuts ~40 KB from the font payload.
    · noscript fallback keeps fonts loading for rare non-JS visitors.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </noscript>
</head>
<body>
  <div id="root"></div>
  <!-- Portal targets -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
